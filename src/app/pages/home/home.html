<div class="mb-4">
  <h1 class="h3 fw-bold mb-1">Seat reservations</h1>
  <p class="text-secondary mb-0">Open an existing show or set up a new one.</p>
</div>

<div class="row g-4">
  <div class="col-lg-5">
    <div class="card h-100">
      <div class="card-body p-4">
        <h2 class="h5 fw-semibold mb-1">
          <i class="bi bi-search me-2 text-primary"></i>Open a show
        </h2>
        <p class="text-secondary small">Enter the show id that was returned when it was created.</p>
        <div class="input-group">
          <span class="input-group-text">#</span>
          <input
            type="number"
            class="form-control"
            placeholder="Show id"
            [(ngModel)]="showId"
            (keyup.enter)="open()"
          />
          <button class="btn btn-primary" (click)="open()">Open</button>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card h-100">
      <div class="card-body p-4">
        <h2 class="h5 fw-semibold mb-1">
          <i class="bi bi-plus-circle me-2 text-primary"></i>Create a show
        </h2>
        <p class="text-secondary small">Admin only. Seats are labelled A1, A2 … B1, B2 and so on.</p>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Admin token</label>
            <input
              type="password"
              class="form-control"
              [ngModel]="session.adminToken()"
              (ngModelChange)="session.setAdmin($event)"
              autocomplete="off"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label">Show name</label>
            <input class="form-control" [(ngModel)]="name" />
          </div>
          <div class="col-4">
            <label class="form-label">Rows</label>
            <input type="number" class="form-control" [(ngModel)]="rows" />
          </div>
          <div class="col-4">
            <label class="form-label">Seats per row</label>
            <input type="number" class="form-control" [(ngModel)]="perRow" />
          </div>
          <div class="col-4">
            <label class="form-label">Price (₹)</label>
            <input type="number" class="form-control" [(ngModel)]="priceRupees" />
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mt-4">
          <span class="text-secondary small">{{ rows * perRow }} seats in total</span>
          <button class="btn btn-primary" [disabled]="busy()" (click)="create()">
            @if (busy()) {
            <span class="spinner-border spinner-border-sm me-2"></span>Creating…
            } @else {
            Create show
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

@if (error()) {
<div class="alert alert-danger mt-4" role="alert">{{ error() }}</div>
}
