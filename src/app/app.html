<nav class="navbar navbar-dark app-navbar sticky-top">
  <div class="container d-flex flex-wrap align-items-center gap-3">
    <a class="navbar-brand d-flex align-items-center gap-2 mb-0" routerLink="/">
      <i class="bi bi-ticket-perforated-fill"></i> SeatBook
    </a>

    <ul class="navbar-nav flex-row gap-3 me-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Shows</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/reservations" routerLinkActive="active">My reservations</a>
      </li>
    </ul>

    <!-- the token IS the identity; it has to start with "user-" for the backend to accept it -->
    <div class="input-group input-group-sm who">
      <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
      <input
        #u
        class="form-control"
        [value]="session.userToken()"
        (change)="session.setUser(u.value)"
        aria-label="Acting as (user token)"
        title="Acting as. The token must start with user-"
      />
    </div>
    @if (demoShowId) {
    <a class="btn btn-outline-primary btn-sm mt-3" [routerLink]="['/shows', demoShowId]">
      Try the demo show
    </a>
    }
    <p class="text-secondary small mt-3 mb-0">
      Booking a seat does not need the admin token. Open a show, pick seats, and book as the
      user shown in the top bar.
    </p>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
